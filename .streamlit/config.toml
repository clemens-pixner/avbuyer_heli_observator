
[theme]
base = "dark"

# General color setup
textColor = "#113F67"
primaryColor = "#226597"
backgroundColor = "#F3F9FB"
secondaryBackgroundColor = "#87C0CD"

showWidgetBorder = true
borderColor = "#113F67"

# Dataframes
dataframeHeaderBackgroundColor = "#87C0CD"

# Base text
font = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
baseFontWeight = 300
baseFontSize = 14

# Heading text
headingFont = "Space Grotesk"
headingFontWeights = [300, 400, 400, 300, 300, 300]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]